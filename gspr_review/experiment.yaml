# Mechanism prototype, not a completed/published method. All variants share TOTAL bytes.
seed: 20260909
root_dir: /data/scd/datasets/opv2v_official_data_dumping/train
validate_dir: /data/scd/datasets/opv2v_official_data_dumping/validate
train_scene_indices: [0, 1, 2, 3]
validation_scene_indices: [0, 1]
frame_stride: 5
batch_size: 1
workers: 2
epochs: 3
steps_per_epoch: 300
learning_rate: 0.0003
clean_train_probability: 0.25
correction_regularization: 0.01
lidar_key: processed_lidar_weather
weather_augmentation:
  mode: mixed_physics_weather
  seed: 20260909
  apply_to_validation: true
  physics_fog:
    # Relative to cjmnet, NOT the process working directory. Override via FOG_LOOKUP_DIR.
    lookup_dir: TripleMixer-main/tools/fog_sim/integral_lookup_tables_seg_light_0.008beta/original
  mixed_physics_weather:
    physics_fog_probability: 0.3333333333333333
    physics_rain_probability: 0.3333333333333333
    physics_snow_probability: 0.3333333333333333
communication:
  variant: a0b0
  budget_bytes: 262144
  value_bytes: 4
  hidden: 32
  temperature: 0.15
review:
  budget_fraction: 0.125
  max_query_blocks: 32
  z_bins: 4
  hidden: 32
  max_adjustment: 0.25
