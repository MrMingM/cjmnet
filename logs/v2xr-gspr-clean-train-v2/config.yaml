name: V2XR_attfuse
root_dir: "/data/cjm/datasets/v2xr-official-train-v2/train"
validate_dir: "/data/cjm/datasets/v2xr-official-validate-v1/validate"
fov: True
train_sim: false
eval_sim: false
sim_weather: '_fog_0.060' #fog_0.060,'_snow_2.5_2.0'

yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 8
  epoches: 20
  eval_freq: 1
  save_freq: 1

fusion:
  core_method: 'IntermediateFusionDatasetV2XR' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  args:
    proj_first: true

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: &achor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl' # hwl or lwh
  max_num: 100 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15

# model related
model:
  core_method: point_pillar_intermediate
  args:
    use_modality: processed_lidar #[processed_lidar,processed_radar]
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *achor_num

    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64

    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      compression: 0

    anchor_num: *achor_num

loss:
  core_method: point_pillar_loss_opencood
  args:
    cls_weight: 1.0
    reg: 2.0

optimizer:
  core_method: Adam
  lr: 0.002
  args:
    eps: 1e-10
    weight_decay: 1e-4

lr_scheduler:
  core_method: multistep #step, multistep and Exponential support
  gamma: 0.1
  step_size: [10, 15]


gspr_experiment: {"experiment": "V2X-R Clean GSPR-AttFuse / official O", "implementation_revision": 2, "training_data": "V2X-R Clean only; 8083 accepted cooperative frames", "initialization": "random; no OPV2V, author, or existing AttFuse checkpoint initialization", "epochs": 20, "seed": 20261017, "selection": "maximum Clean validation O AP70; earliest epoch on exact ties", "model": {"hidden_dim": 32, "context_dim": 16, "max_points_per_voxel": 32, "intensity_index": 3, "ring_index": null, "spectral_downsample": 4, "reliability_floor": 0.05, "initial_reliability": 0.95, "evidence_cap": 30.0}, "loss": {"base_detection_loss": "opencood.loss.point_pillar_loss_opencood.PointPillarLossOpenCOOD", "point_supervision": false, "keep_weight": 0.02, "evidence_weight": 0.0001, "target_keep_rate": 0.9}, "insertion": "frozen GSPR on voxel XYZI; multiply decorated valid features immediately before the first official PFN", "gt_filter": "unchanged official input-dependent GT; GSPR weights never modify point counts or GT", "evaluation": "official O main result; O*/F retained as audit only"}
