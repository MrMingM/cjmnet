name: v2v4real_point_pillar_UAPF
root_dir: 'dataset/V2V4REAL/train'
validate_dir: 'dataset/V2V4REAL/validate'

wild_setting:
  async: false
  async_overhead: 100
  seed: 20
  loc_err: false
  xyz_std: 0.2
  ryp_std: 0.2
  data_size: 1.06 # Mb!!
  transmission_speed: 27 # Mbps!!
  backbone_delay: 10 # ms

  
comm_range: 100
input_source: ['lidar']
yaml_parser: "load_point_pillar_params"
train_params:
  batch_size: &batch_size 12
  epoches: &epoches 50
  eval_freq: 2
  save_freq: 5
  max_cav: &max_cav 2

fusion:
  core_method: 'v2v4realintermediate' # LateFusionDataset, EarlyFusionDataset, IntermediateFusionDataset supported
  dataset: 'v2v4real'
  args: 
    proj_first: False

# preprocess-related
preprocess:
  # options: BasePreprocessor, VoxelPreprocessor, BevPreprocessor
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  # lidar range for each individual cav.
  cav_lidar_range: &cav_lidar [-102.4, -51.2, -3.5, 102.4, 51.2, 1.5]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: [ 'x' ]

  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [ -0.78539816, 0.78539816 ]

  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [ 0.95, 1.05 ]

# anchor box related
postprocess:
  core_method: 'VoxelPostprocessor' # VoxelPostprocessor, BevPostprocessor supported
  gt_range: *cav_lidar
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: &anchor_yaw [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.2
  order: 'hwl' # hwl or lwh
  max_num: 150 # maximum number of objects in a single frame. use this number to make sure different frames has the same dimension in the same batch
  nms_thresh: 0.15
  dir_args: &dir_args
    dir_offset: 0.7853
    num_bins: 2
    anchor_yaw: *anchor_yaw


# model related
model:
  core_method: bev_text_v1
  args:
    use_gt_unmap: False
    supervise_single: true
    modality: ['lidar']
    lidar_range: *cav_lidar
    voxel_size: *voxel_size
    feature_embedding: &feature_embedding 256
    pillar_vfe:
        use_norm: true
        with_distance: false
        use_absolute_xyz: true
        num_filters: [64]
    point_pillar_scatter:
        num_features: 64

    backbone_args:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]

    shrink_header: 
      kernal_size: [ 3 ]
      stride: [ 1 ]
      padding: [ 1 ]
      dim: [ *feature_embedding ]
      input_dim: 384 # 128 * 3

    in_head_single: *feature_embedding
    in_head: *feature_embedding
    
    anchor_number: *anchor_num
    dir_args: *dir_args

    fusion_method: 'PyramidFuserv1'

    use_edgeboost: False

    fusion_operation: 'sum'


loss:
  core_method: point_pillar_depth_loss
  args:
    pos_cls_weight: 2.0
    cls:
      type: 'SigmoidFocalLoss'
      alpha: 0.25
      gamma: 2.0
      weight: 1.0
    reg:
      type: 'WeightedSmoothL1Loss'
      sigma: 3.0
      codewise: true
      weight: 2.0
    dir:
      type: 'WeightedSoftmaxClassificationLoss'
      weight: 0.2
      args: *dir_args
    depth:
      weight: 0.5



optimizer:
  core_method: AdamW      
  lr: 0.002              
  args:
    eps: 1e-10              
    weight_decay: 1e-4      

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [20, 40]
