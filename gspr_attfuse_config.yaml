name: gspr_attfuse_opv2v
root_dir: '/data/scd/datasets/opv2v_official_data_dumping/train'
validate_dir: '/data/scd/datasets/opv2v_official_data_dumping/validate'
yaml_parser: "load_point_pillar_params"

train_params:
  batch_size: 4
  epoches: 15
  eval_freq: 1
  save_freq: 1
  max_cav: 5

fusion:
  core_method: 'IntermediateFusionDataset'
  args: []

preprocess:
  core_method: 'SpVoxelPreprocessor'
  args:
    voxel_size: &voxel_size [0.4, 0.4, 4]
    max_points_per_voxel: 32
    max_voxel_train: 32000
    max_voxel_test: 70000
  cav_lidar_range: &cav_lidar [-140.8, -40, -3, 140.8, 40, 1]

data_augment:
  - NAME: random_world_flip
    ALONG_AXIS_LIST: ['x']
  - NAME: random_world_rotation
    WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
  - NAME: random_world_scaling
    WORLD_SCALE_RANGE: [0.95, 1.05]

postprocess:
  core_method: 'VoxelPostprocessor'
  anchor_args:
    cav_lidar_range: *cav_lidar
    l: 3.9
    w: 1.6
    h: 1.56
    r: [0, 90]
    feature_stride: 2
    num: &anchor_num 2
  target_args:
    pos_threshold: 0.6
    neg_threshold: 0.45
    score_threshold: 0.20
  order: 'hwl'
  max_num: 100
  nms_thresh: 0.15

model:
  core_method: point_pillar_gspr_attfuse
  args:
    voxel_size: *voxel_size
    lidar_range: *cav_lidar
    anchor_number: *anchor_num
    anchor_num: *anchor_num
    gspr:
      hidden_dim: 32
      context_dim: 16
      max_points_per_voxel: 32
      intensity_index: 3
      # OPV2V stores xyzi only. If a future dataset supplies ring as a fifth
      # field, set ring_index: 4; otherwise elevation is used as its proxy.
      ring_index: null
      spectral_downsample: 4
      reliability_floor: 0.05
      initial_reliability: 0.95
      evidence_cap: 30.0
    pillar_vfe:
      use_norm: true
      with_distance: false
      use_absolute_xyz: true
      num_filters: [64]
    point_pillar_scatter:
      num_features: 64
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      upsample_strides: [1, 2, 4]
      num_upsample_filter: [128, 128, 128]
      compression: 0

loss:
  core_method: gspr_point_pillar_loss
  args:
    cls_weight: 1.0
    reg: 2.0
    point_weight: 1.0
    keep_weight: 0.02
    evidence_weight: 0.0001
    target_keep_rate: 0.90

optimizer:
  core_method: Adam
  lr: 0.0002
  args:
    eps: 1.0e-10
    weight_decay: 1.0e-4

lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [8, 12]
